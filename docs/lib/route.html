<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Route</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#e0f2fe; color:#075985; font-size:12px; margin-right:8px; }
    a { color: #2563eb; }
    code { background: #e2e8f0; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill">Mini site</div>
      <div class="pill">Docs</div>
      <h1>Library</h1>
      <p>This route points to the docs mini site for the block library.</p>
      <p>Open the local file: <code>docs/lib/index.html</code></p>
      <p>Dashboard version: <code>docs/lib/dashboard.html</code></p>
      <p>To host it inside the app, create a dedicated app route like <code>/docs/lib</code> or <code>/library</code>.</p>
      <p><a href="index.html">Open docs mini site</a></p>
    </div>
  </div>
</body>
</html>
